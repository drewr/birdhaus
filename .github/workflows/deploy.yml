# Deploy the store with run.hs. Every push to main deploys dev as
# vX.Y.Z-dev.N; publishing a GitHub release vX.Y.Z deploys that tag to prod.
# run.hs waits until the new version is serving with its migrations applied
# (the server runs them at startup), so a green run means the rollout is done.
#
# Needs, in the repo settings:
#   - secret DATUM_CREDENTIALS: a Datum service account's credentials JSON,
#     with rights to deploy workloads in the project;
#   - environments "development" and "production" (production limited to
#     v* tags);
#   - the ghcr.io/drewr/birdhaus-store package giving this repo write access
#     (package settings, "Manage Actions access"), so GITHUB_TOKEN can push.
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DATUM_PROJECT: drewr-y4nd1b
  REGISTRY_USER: ${{ github.repository_owner }}
  DATUMCTL_VERSION: v0.23.3
  DATUMCTL_SHA256: 9af908ebdfade0c4dbb0afd4ac96c485fdeaef66f78ebe294b1891ade50bd5fe
  COMPUTE_PLUGIN: datum/compute@v0.12.8
  # The runner's Docker can't export OCI images, so builds use this.
  BUILDKIT_IMAGE: moby/buildkit:v0.23.2
  BUILDKIT_HOST: docker-container://buildkitd

jobs:
  dev:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment: development
    concurrency: { group: deploy-dev, cancel-in-progress: false }
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # run.hs counts commits since the last release tag for the version.
          fetch-depth: 0
      - &nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          # A fixed nixpkgs (nixpkgs-unstable on 2026-11-08), so the scripts get
          # the same tools every run and its unpacked source can be cached
          # instead of fetched; the tarball never changes, so Nix needn't
          # check it again. Bump the revision to update the tools.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/4fe25e12eb9f4c744966dd3de5a05246cf098601.tar.gz
          # runner is trusted so it can import the cached closure, which is
          # unsigned.
          extra_nix_config: |
            tarball-ttl = 31536000
            trusted-users = root runner
      # Downloads that only change with the lockfiles or this workflow: nixpkgs,
      # npm's cache and spago's registry and packages. Saved once per key.
      - &deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/nix
            ~/.npm
            .cache/spago-home
            .spago
          key: deploy-deps-${{ hashFiles('.github/workflows/deploy.yml', 'package-lock.json', 'spago.lock') }}
      # Compiled PureScript from the last run, so purs rebuilds only the
      # modules that changed.
      - &purs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output
          key: purs-output-${{ github.sha }}
          restore-keys: purs-output-
      # run.hs compiled with its tools (.github/run-hs.nix), kept as an exported
      # Nix closure of about 570 MB. Interpreting it with runghc instead needs
      # GHC, 675 MiB to download and 3.9 GiB unpacked, on every run.
      - &runhscache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/run-hs
          key: run-hs-${{ hashFiles('run.hs', '.github/run-hs.nix', '.github/workflows/deploy.yml') }}
      - &runhs
        name: Build or import run.hs
        run: |
          dir="$RUNNER_TEMP/run-hs"
          if [ -f "$dir/closure" ]; then
            nix-store --import < "$dir/closure" > /dev/null
          else
            mkdir -p "$dir"
            nix-build .github/run-hs.nix --no-out-link > "$dir/path"
            nix-store --export $(nix-store -qR "$(cat "$dir/path")") > "$dir/closure"
          fi
          echo "RUN_HS=$(cat "$dir/path")/bin/run-hs" >> "$GITHUB_ENV"
      - &datumctl
        name: Install datumctl and sign in
        env:
          DATUM_CREDENTIALS: ${{ secrets.DATUM_CREDENTIALS }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/datumctl.tgz" "https://github.com/datum-cloud/datumctl/releases/download/$DATUMCTL_VERSION/datumctl_Linux_x86_64.tar.gz"
          echo "$DATUMCTL_SHA256  $RUNNER_TEMP/datumctl.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "$RUNNER_TEMP/datumctl.tgz" -C "$HOME/.local/bin" datumctl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/datumctl" plugin install "$COMPUTE_PLUGIN"
          umask 077 && printf '%s' "$DATUM_CREDENTIALS" > "$RUNNER_TEMP/datum.json"
          "$HOME/.local/bin/datumctl" login --credentials "$RUNNER_TEMP/datum.json"
          rm -f "$RUNNER_TEMP/datum.json"
      - &buildkit
        name: Start BuildKit
        run: docker run -d --name buildkitd --privileged "$BUILDKIT_IMAGE"
      - name: Deploy dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$RUN_HS" -p "$DATUM_PROJECT" -r ghcr-drewr -u "$REGISTRY_USER"
          -w birdhaus-store-dev -d dev.birdhaus.store -b birdhaus-store-dev-db
          -k birdhaus-stripe-test -A birdhaus-store-dev-auth -R birdhaus-store-dev-rauthy
          --replicas 1

  prod:
    # A prerelease is for trying a tag, not for customers.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - *checkout
      - name: Check the release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags are vX.Y.Z, not $TAG"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main, so dev never ran it"; exit 1; }
      - *nix
      - *deps
      - *purs
      - *runhscache
      - *runhs
      - *datumctl
      - *buildkit
      # Low-stock alerts go to the ALERT_EMAIL repository variable, so the
      # address stays out of the repository.
      - name: Deploy prod
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: >-
          "$RUN_HS" -p "$DATUM_PROJECT" -r ghcr-drewr -u "$REGISTRY_USER" --version "$TAG" ${ALERT_EMAIL:+--alert-email "$ALERT_EMAIL"}
