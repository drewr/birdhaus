# Appended to postgresql.conf by entrypoint.sh (include_if_exists), so these
# win over the defaults and over whatever a restored backup carried.
listen_addresses = '*'
password_encryption = scram-sha-256

# Continuous archiving to S3. archive_timeout bounds data loss: a WAL segment
# is shipped at least every 60 seconds even when it is not full.
wal_level = replica
archive_mode = on
archive_timeout = 60
archive_command = 'wal-g wal-push %p'
restore_command = 'wal-g wal-fetch %f %p'
recovery_target_timeline = 'latest'
wal_compression = on

log_checkpoints = on
