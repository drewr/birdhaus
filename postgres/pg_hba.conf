# Replaced on every boot by entrypoint.sh.
# The superuser is reachable only over the local socket, as the postgres OS user.
local all postgres peer
local all all      scram-sha-256
host  all postgres 0.0.0.0/0 reject
host  all postgres ::/0      reject
# Instances sit on the project's private IPv6 network (fd00::/8).
host  all all      ::1/128   scram-sha-256
host  all all      fd00::/8  scram-sha-256
