apiVersion: dns.networking.miloapis.com/v1alpha1
kind: DNSRecordSet
metadata:
  name: birdhaus-store-aaaa
  namespace: default
spec:
  dnsZoneRef:
    name: birdhaus-store-1kamnr
  recordType: AAAA
  records:
  # The Postgres instance's private address in the birdhaus Network. Only
  # reachable from inside that Network; published so clients can use a name
  # (some drivers cannot parse an IPv6 literal) and survive address changes.
  - name: db
    ttl: 300
    aaaa:
      content: fd20:0:4a::1:0:0
  # The Rauthy instance's private address. Server-side OIDC calls (discovery,
  # JWKS, token exchange) use this name because the public hostname hairpins
  # through the edge and times out from inside the Network. Update it if the
  # auth instance is replaced with a new address.
  - name: auth-internal
    ttl: 300
    aaaa:
      content: fd20:0:4a::4:0:0
