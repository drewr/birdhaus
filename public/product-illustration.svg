<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Line illustration of a bluebird house">
  <!-- overhanging roof -->
  <path d="M120 22 L32 94 L208 94 Z"/>
  <!-- body -->
  <rect x="60" y="94" width="120" height="118"/>
  <!-- entrance hole (no perch: the bluebird-house standard) -->
  <circle cx="120" cy="140" r="22"/>
  <!-- floor line -->
  <line x1="60" y1="196" x2="180" y2="196" stroke-width="2" opacity="0.5"/>
  <!-- mounting post -->
  <line x1="120" y1="212" x2="120" y2="250" stroke-width="5"/>
  <!-- ground -->
  <line x1="74" y1="250" x2="166" y2="250" stroke-width="2"/>
</svg>
